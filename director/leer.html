<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf6">
  <title>Lector iBook · Consultor Director</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="apple-touch-icon" href="../assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">

  <link rel="stylesheet" href="css/director.css?v=10">
</head>
<body>

  <header class="dir-header ibk-header">
    <div class="dir-header-inner">
      <a href="index.html" class="dir-brand">
        <img src="../assets/logo.png" alt="" onerror="this.style.display='none'">
        <span>Consultor <span class="brand-mark">Director</span></span>
      </a>

      <div class="ibk-header-doc">
        <span class="doc-abbr-large" id="doc-abbr">--</span>
        <span class="ibk-doc-title" id="doc-title">Cargando…</span>
        <span class="ibk-page-pill" id="current-page">1 / 1</span>
      </div>

      <div class="ibk-toolbar">
        <button class="icon-btn" id="btn-toc-toggle" title="Tabla de contenidos" aria-label="TOC">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button class="icon-btn" id="btn-font-down" title="Fuente más chica" aria-label="A-">A−</button>
        <span class="font-pill" id="font-pill">18px</span>
        <button class="icon-btn" id="btn-font-up" title="Fuente más grande" aria-label="A+">A+</button>
        <button class="icon-btn" id="btn-summary" title="Resumir esta página con IA" aria-label="Resumir">🪄</button>
        <button class="icon-btn" id="btn-theme" title="Cambiar modo (claro/sepia/oscuro)" aria-label="Tema">☀️</button>
        <a class="icon-btn" id="btn-pdf" title="Ver el PDF original" aria-label="PDF">PDF</a>
      </div>
    </div>
  </header>

  <div class="ibk-shell">
    <aside class="ibk-toc-aside" id="toc-aside">
      <div class="ibk-toc-head">
        <h3>Contenido</h3>
        <button id="btn-toc-close" class="icon-btn">×</button>
      </div>
      <ul class="ibk-toc" id="toc-list"></ul>
    </aside>

    <main class="ibk-main" id="leer-main">
      <p class="muted" style="text-align:center;padding:3rem"><span class="spinner"></span> Cargando…</p>
    </main>
  </div>

  <script type="module" src="js/leer.js?v=4"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
    }
    document.getElementById("btn-toc-close")?.addEventListener("click", () => {
      document.getElementById("toc-aside").classList.remove("open");
    });
  </script>

  <nav class="bottom-nav" aria-label="Navegación">
    <a href="index.html" class="" aria-label="Catálogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Catálogo</span></a>
    <a href="buscar.html" class="active" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>Buscar</span></a>
    <a href="consultor.html" class="" aria-label="IA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span>IA</span></a>
    <a href="estudiar.html" class="" aria-label="Plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>Plan</span></a>
    <a href="mis-notas.html" class="" aria-label="Mi Estudio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span>Mi Estudio</span></a>
  </nav>
</body>
</html>
