<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf6">
  <title>Lector · Consultor Director</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="../assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">

  <link rel="stylesheet" href="css/director.css?v=1">
</head>
<body>

  <header class="dir-header">
    <div class="dir-header-inner">
      <a href="index.html" class="dir-brand">
        <img src="../assets/logo.png" alt="" onerror="this.style.display='none'">
        <span>Consultor <span class="brand-mark">Director</span></span>
      </a>
      <div class="dir-header-search">
        <input type="search" id="header-search" placeholder="Buscar en las 16 fuentes…" aria-label="Buscar">
      </div>
      <nav class="dir-header-nav">
        <a href="index.html">Catálogo</a>
        <a href="buscar.html">Buscar</a>
      </nav>
    </div>
  </header>

  <div class="reader-shell">
    <aside class="reader-aside" id="reader-aside">
      <p style="color:var(--ink-3)"><span class="spinner"></span> Cargando…</p>
    </aside>
    <iframe id="reader-frame" class="reader-frame" title="Visor de documento" allow="fullscreen"></iframe>
  </div>

  <script type="module" src="js/reader.js?v=1"></script>
  <script>
    // Header search → ir a buscar.html
    document.getElementById("header-search")?.addEventListener("keydown", e => {
      if (e.key === "Enter" && e.target.value.trim()) {
        location.href = "buscar.html?q=" + encodeURIComponent(e.target.value.trim());
      }
    });
  </script>
</body>
</html>
